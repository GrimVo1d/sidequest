<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<!-- 'unsafe-eval' is required by the pywebview bridge; nothing may load from outside. -->
<meta http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self' 'unsafe-eval'; style-src 'self'; img-src 'self' data:; font-src 'self'; frame-src 'self'; connect-src 'none'">
<title>Sidequest</title>
<link rel="stylesheet" href="hub.css">
</head>
<body>
<header class="bar">
  <div class="logo">SIDEQUEST</div>
  <div class="indicator" id="indicator"><span class="dot"></span><span id="indicator-text" data-en="Checking…">Проверка…</span></div>
  <div class="spacer"></div>
  <button id="btn-check" data-en="Check">Проверить</button>
  <button id="btn-connect">Подключить к Claude Code</button>
  <button id="btn-settings" data-en="Settings">Настройки</button>
</header>

<main id="hub">
  <section class="col left">
    <div class="panel profile">
      <canvas id="avatar" class="avatar" title="Сменить аватарку" data-en-title="Change the avatar"></canvas>
      <button id="btn-avatar" class="small" data-en="Change the avatar">Сменить аватарку</button>
      <input id="profile-name" maxlength="32" spellcheck="false">
      <dl id="stats"></dl>
    </div>
    <div class="panel">
      <h2 data-en="Sessions">Сессии</h2>
      <ul id="sessions" class="list"></ul>
      <p id="first-event" class="hint" data-en="Waiting for the first event from Claude Code">Ждём первое событие от Claude Code</p>
    </div>
  </section>

  <section class="col center">
    <div class="panel">
      <h2 data-en="Modes">Режимы</h2>
      <div id="dlc-list" class="dlc-grid"></div>
    </div>
    <div class="panel" id="check-panel">
      <h2 data-en="Self-check">Самопроверка</h2>
      <ul id="checks" class="list"></ul>
    </div>
  </section>

  <section class="col right">
    <div class="panel journal">
      <h2 data-en="Journal">Журнал</h2>
      <ul id="journal" class="list mono"></ul>
    </div>
  </section>
</main>

<!-- A DLC takes the whole window; it goes back to the hub with Sidequest.exit(). -->
<section id="game" hidden>
  <iframe id="game-frame" aria-label="DLC"></iframe>
  <span id="game-flag" class="flag" data-en="not counted" hidden>не засчитывается</span>
</section>

<div id="pause" class="overlay" hidden>
  <div class="banner">
    <div id="pause-title"></div>
    <ul id="pause-list"></ul>
    <div class="actions"><button id="btn-resume" data-en="Resume">Продолжить</button></div>
  </div>
</div>

<div id="modal" class="overlay" hidden>
  <div class="dialog">
    <h2 id="modal-title"></h2>
    <div id="modal-body"></div>
    <div class="actions" id="modal-actions"></div>
  </div>
</div>

<aside id="dev" hidden>
  <h2>Панель разработчика</h2>
  <div class="row">
    <select id="dev-source"></select>
    <select id="dev-speed"><option>1</option><option>2</option><option>5</option><option>10</option></select>
    <button id="dev-play">▶ Проиграть</button>
    <button id="dev-pause">❚❚</button>
    <button id="dev-step">Шаг</button>
    <button id="dev-stop">■</button>
    <input id="dev-seek" type="range" min="0" max="0" step="0.1" value="0">
    <span id="dev-pos" class="mono"></span>
  </div>
  <div class="row" id="dev-send"></div>
  <div class="row" id="dev-dlc"></div>
  <div class="row">
    <select id="dev-session"></select>
    <button id="dev-export">Сохранить запись</button>
    <span id="dev-msg" class="hint"></span>
  </div>
</aside>

<script src="../sdk/i18n.js"></script>
<script src="../sdk/avatar.js"></script>
<script src="avatar-import.js"></script>
<script src="avatar-ui.js"></script>
<script src="hub.js"></script>
</body>
</html>
